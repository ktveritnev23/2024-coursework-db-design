<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Model Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <button id="downloadButton">Download model</button>
        <button id="uploadButton">Upload model</button>
        <div class="separator"></div>

        <button id="addEntityButton">Add Entity</button>

        <input type="file" id="fileInput" style="display: none;" />

        <!-- Параметры сущности-->
        <div id="entityOptions" style="display: none;">
            <input type="text" id="entityNameInput" placeholder="Enter entity name">

            <div class="entity-type-options">
                <label><input type="radio" name="entityType" value="strong" checked> Strong Entity</label>
                <label><input type="radio" name="entityType" value="weak"> Weak Entity</label>
                <label><input type="radio" name="entityType" value="subtype"> Subtype</label>
            </div>

            <div>
                <label><input type="checkbox" id="relationalEntityCheckbox"> Relational Entity</label>
            </div>

            <h4>Identifiers</h4>
            <div id="identifiersList"></div>
            <input type="text" id="identifierInput" placeholder="Enter identifier">
            <button id="addIdentifierButton">Add Identifier</button>

            <h4>Attributes</h4>
            <div id="attributesList"></div>
            <input type="text" id="attributeInput" placeholder="Enter attribute">
            <button id="addAttributeButton">Add Attribute</button>

            <button id="createEntityButton">Create Entity</button>
        </div>



        <!-- Параметры выбранной сущности -->
        <div id="selectedEntityData" style="display: none;">
            <input type="text" id="selectedEntityNameInput" placeholder="Entity name">

            <h4>Identifiers</h4>
            <div id="selectedIdentifiersList"></div>
            <input type="text" id="newIdentifierInput" placeholder="Enter new identifier">
            <button id="addNewIdentifierButton" class="addButton">Add New Identifier</button>

            <h4>Attributes</h4>
            <div id="selectedAttributesList"></div>
            <input type="text" id="newAttributeInput" placeholder="Enter new attribute">
            <button id="addNewAttributeButton" class="addButton">Add New Attribute</button>

            <!-- Checkbox для реляционной модели -->

            <div id="relationalAttributes" style="display: none;">
                <label><input type="checkbox" id="isNull"> NULL</label>
                <label><input type="checkbox" id="isForeignKey"> Foreign Key</label>
                <h5>Attribute Type</h5>

                <select id="attributeTypeSelect">
                    <option value="int">INT</option>
                    <option value="nvarchar">NVARCHAR</option>
                    <option value="money">MONEY</option>
                </select>
                <div id="lengthInputContainer" style="display: none;">
                    <label for="attributeLength">Length</label>
                    <input type="number" id="attributeLength" placeholder="Length (for int, nvarchar)">
                </div>
            </div>

        </div>

        <!-- Связи -->
        <button id="addEdgeButton">Add Edge</button>

        <!-- Панель управления для связей -->
        <div id="handlesOptions" style="display: none;">
            <h4>Cardinality</h4>
            <select id="handle1TypeSelect">
                <option value="oneOptional">One-Optional</option>
                <option value="manyOptional">Many-Optional</option>
                <option value="oneMandatory">One-Mandatory</option>
                <option value="manyMandatory">Many-Mandatory</option>
            </select>

            <select id="handle2TypeSelect">
                <option value="oneOptional">One-Optional</option>
                <option value="manyOptional">Many-Optional</option>
                <option value="oneMandatory">One-Mandatory</option>
                <option value="manyMandatory">Many-Mandatory</option>
            </select>

            <button id="createEdgeButton" style="display: none;">Create Edge</button>

        </div>
        <button id="createSubtypeButton">Create Subtype</button>
    </div>

    

    <button id="deleteEntityButton">Delete Entity</button>
    <button id="deleteEdgeButton" style="display: none;">Delete Edge</button>


    <svg id="svgContainer"></svg>
    <script src="script.js"></script>
</body>

</html>
